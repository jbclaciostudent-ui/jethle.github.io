<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jethlee Clacio Gwapo</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      font-family: Arial, Helvetica, sans-serif;
    }

    .card {
      background: #ffffff;
      padding: 35px 40px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
      text-align: center;
      max-width: 320px;
      width: 90%;
    }

    .profile-photo {
      width: 160px;
      height: 160px;
      object-fit: cover;
      border-radius: 50%;
      border: 4px solid #2a5298;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 24px;
      color: #1e3c72;
    }

    p {
      margin: 0;
      font-size: 15px;
      color: #555555;
    }
  </style>
</head>
<body>

  <div class="card">
    <!-- Replace the src below with your own photo file name, e.g., src="jethlee.jpg" -->
    <img 
      src="data:image/svg+xml;utf8,<svg xmlns='Freaky Man.jpg' width='200' height='200' viewBox='0 0 200 200'><rect width='200' height='200' fill='%23dbe4f3'/><circle cx='100' cy='75' r='35' fill='%232a5298'/><path d='M40 175 C40 130, 160 130, 160 175' fill='%232a5298'/></svg>" 
      alt="Jethlee Clacio Gwapo" 
      class="profile-photo"
    >
    <h1>Jethlee Clacio Gwapo</h1>
    <p>Welcome to my page!</p>
  </div>

</body>
</html>
